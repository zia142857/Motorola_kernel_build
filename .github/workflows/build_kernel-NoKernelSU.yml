name: Build moto edge s (Lineage OS 23.2 A16)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    name: moto edge s (Lineage OS 23.2 A16)
    runs-on: ubuntu-latest

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v4

      - name: ⌛️ Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git libssl-dev libelf-dev lz4 python3 \
            zip device-tree-compiler xz-utils

      - name: 📥 Clone kernel source
        run: |
          git clone --depth=1 \
            -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_motorola_sm8250.git \
            device_kernel

      - name: 🔧 Download Clang r574158
        run: |
          mkdir -p clang
          curl -L "https://github.com/bachnxuan/aosp_clang_mirror/releases/download/clang-r574158-14475230/clang-r574158.tar.gz" | tar -xz -C clang

      - name: 🏗️ Generate defconfig
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          cd device_kernel

          make O=out ARCH=arm64 \
            CC=clang HOSTCC=gcc HOSTCXX=g++ \
            LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC=/usr/bin/dtc DTC_EXT=/usr/bin/dtc \
            vendor/kona-perf_defconfig

          ./scripts/kconfig/merge_config.sh -O out/ -m out/.config \
            arch/arm64/configs/vendor/ext_config/moto-kona.config \
            arch/arm64/configs/vendor/ext_config/nio-default.config

          scripts/config --file out/.config \
            --disable CONFIG_MODULE_SIG \
            --disable CONFIG_MODULE_SIG_FORCE \
            --disable CONFIG_MODULE_SIG_ALL \
            --disable CONFIG_MODVERSIONS \
            --enable CONFIG_CFI_PERMISSIVE \
            --set-val CONFIG_PANIC_TIMEOUT -1

          make O=out ARCH=arm64 \
            CC=clang HOSTCC=gcc HOSTCXX=g++ \
            LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC=/usr/bin/dtc DTC_EXT=/usr/bin/dtc \
            olddefconfig

      - name: 🔍 Verify config
        run: |
          cd device_kernel
          echo "=== LTO ===" && grep "CONFIG_LTO" out/.config
          echo "=== CFI ===" && grep "CONFIG_CFI" out/.config
          echo "=== MODULE_SIG ===" && grep "CONFIG_MODULE_SIG" out/.config
          echo "=== MODVERSIONS ===" && grep "CONFIG_MODVERSIONS" out/.config

      - name: 🚀 Build kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          cd device_kernel

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang HOSTCC=gcc HOSTCXX=g++ \
            LD=ld.lld LLVM=1 LLVM_IAS=1 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            DTC=/usr/bin/dtc DTC_EXT=/usr/bin/dtc \
            KCFLAGS="-Wno-unknown-warning-option -Wno-pointer-sign -Wno-unused-but-set-variable -Wno-gnu-variable-sized-type-not-at-end -Wno-tautological-constant-out-of-range-compare" \
            2>&1 | tee build.log

          ls -lh out/arch/arm64/boot/Image

      - name: 🌲 Collect DTBs
        run: |
          cd device_kernel
          DTB_DIR="out/arch/arm64/boot/dts/vendor/qcom"

          # 列出所有 DTB 文件
          echo "=== Available DTBs ==="
          ls $DTB_DIR/*.dtb | head -20

          # 找到 nio 相关 DTB
          echo "=== nio DTBs ==="
          ls $DTB_DIR/*nio*.dtb 2>/dev/null || echo "No nio-specific DTB found"
          ls $DTB_DIR/*kona-moto*.dtb 2>/dev/null || echo "No kona-moto DTB found"

          # 合并所有 kona-moto DTB（和官方构建方式一致）
          cat $DTB_DIR/kona-moto*.dtb > ../combined-dtb.img
          ls -lh ../combined-dtb.img
          echo "DTB_READY=true" >> $GITHUB_ENV

      - name: 📦 Package boot.img
        run: |
          # 下载官方 boot.img
          curl -L "https://mirrors.ocf.berkeley.edu/lineageos/full/nio/20260615/boot.img" \
            -o boot_source.img

          # 下载 magiskboot
          curl -L "https://github.com/topjohnwu/Magisk/releases/download/v28.0/Magisk-v28.0.apk" \
            -o Magisk.apk
          unzip -p Magisk.apk lib/x86_64/libmagiskboot.so > magiskboot
          chmod +x magiskboot

          # 解包并替换内核
          ./magiskboot unpack boot_source.img
          cp device_kernel/out/arch/arm64/boot/Image kernel
          ./magiskboot repack boot_source.img new-boot.img

          ls -lh new-boot.img

      - name: 📦 Package vendor_boot.img
        run: |
          # 下载官方 vendor_boot.img
          curl -L "https://mirrors.ocf.berkeley.edu/lineageos/full/nio/20260615/vendor_boot.img" \
            -o vendor_boot_source.img

          mkdir vendor_boot_unpack
          cp vendor_boot_source.img vendor_boot_unpack/
          cd vendor_boot_unpack

          # 解包 vendor_boot
          ../magiskboot unpack vendor_boot_source.img

          # 替换 DTB
          cp ../combined-dtb.img dtb

          # 重新打包
          ../magiskboot repack vendor_boot_source.img new-vendor_boot.img

          cp new-vendor_boot.img ../
          cd ..
          ls -lh new-vendor_boot.img

      - name: ✏️ Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nio-lineage23.2-images
          path: |
            new-boot.img
            new-vendor_boot.img
            device_kernel/build.log