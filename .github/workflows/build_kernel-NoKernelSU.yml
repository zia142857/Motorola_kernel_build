name: Build Kernel (nio, Perfect-Reproduction)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WorkSpace
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev libssl-dev libelf-dev bistrip flex bison textinfo libselinux1-dev unzip wget curl
          
      - name: Pull Official Android NDK r29 (For Clang 21)
        run: |
          cd $GITHUB_WORKSPACE
          echo "=====> Downloading Android NDK r29..."
          wget -q https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          echo "=====> Extracting NDK..."
          unzip -q android-ndk-r29-linux.zip
          rm android-ndk-r29-linux.zip
          
      - name: Pull Kernel Source (lineage-23.2)
        run: |
          cd $GITHUB_WORKSPACE
          # 精准克隆 LineageOS 23.2 分支的内核源码
          git clone --depth=1 https://github.com/LineageOS/android_kernel_motorola_sm8250.git -b lineage-23.2 kernel-source

      - name: Inject Configuration (Via Raw URL) & Auto-Adapt
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          mkdir -p out
          
          # 【精准修复】不克隆仓库，直接用 curl 从你的 master 分支拉取单一的 config 文件并写入 out/.config
          curl -Lo out/.config https://raw.githubusercontent.com/zia142857/Motorola_kernel_build/master/config
          
          # 导入 NDK 中的 Clang 21 工具链
          export PATH="$GITHUB_WORKSPACE/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          # 打印 Clang 版本，供 Actions 日志自查
          clang -v
          
          # 让新编译器对提取的配置进行自适应自补全
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Start Fully Compiling (Image + DTBs)
        run: |
          cd $GITHUB_WORKSPACE/kernel-source
          export PATH="$GITHUB_WORKSPACE/android-ndk-r29/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="adn_builder"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          
          # 全速编译 Image 本体与全套高通厂商设备树
          make -j$(nproc --all) O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image dtbs

      - name: Physically Stitch Image-dtb & Packaging
        run: |
          cd $GITHUB_WORKSPACE
          # 克隆 AnyKernel3 官方卡刷底包
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/LICENSE AnyKernel3/README.md
          
          # 将内核 Image 与所有高通生成驱动的 dtb 硬件树硬合并拼接
          cat kernel-source/out/arch/arm64/boot/Image kernel-source/out/arch/arm64/boot/dts/vendor/qcom/*.dtb > kernel-source/out/arch/arm64/boot/Image-dtb
          
          # 复制拼接好的完整内核到 AnyKernel 目录下，强制按 Moto Edge S 的 BoardConfig.mk 规范命名为 "kernel"
          cp kernel-source/out/arch/arm64/boot/Image-dtb AnyKernel3/kernel
          
          # 额外检查是否有 DTBO 分区文件生成，如有则一同带走
          if [ -f kernel-source/out/arch/arm64/boot/dtbo.img ]; then
            cp kernel-source/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

      - name: Upload Finished Kernel Zip to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moto-EdgeS-Nio-Kernel-Perfect
          path: AnyKernel3/*
