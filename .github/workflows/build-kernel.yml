name: Stable KernelSU Next 4.19 (Moto Edge S)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make \
          python3 gcc-aarch64-linux-gnu zip curl

      # ======================
      # Kernel Source
      # ======================
      - name: Clone kernel source
        run: |
          git clone ${{ secrets.KERNEL_SOURCE }} kernel

      # ======================
      # KernelSU Next (STABLE)
      # ======================
      - name: Clone KernelSU Next legacy
        run: |
          git clone -b legacy-4.19 \
          https://github.com/KernelSU-Next/KernelSU-Next.git kernelsu

      - name: Integrate KernelSU Next (safe mode)
        run: |
          cd kernelsu

          # ⚠️ 关键：关闭高风险hook
          export KSU_KERNEL_4_19=1
          export KSU_MODULE_ONLY=1

          bash scripts/integrate.sh ../kernel

      # ======================
      # Fix 4.19 config safety
      # ======================
      - name: Patch kernel config for stability
        run: |
          cd kernel

          echo "CONFIG_KSU=y" >> arch/arm64/configs/nio_defconfig
          echo "CONFIG_KSU_MODULE=y" >> arch/arm64/configs/nio_defconfig
          echo "# CONFIG_KSU_KPROBES is not set" >> arch/arm64/configs/nio_defconfig

      # ======================
      # Build
      # ======================
      - name: Build kernel
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make O=out nio_defconfig
          make -j$(nproc) O=out

      # ======================
      # Package
      # ======================
      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git ak3

          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/

          cd ak3
          zip -r KernelSU_Stable_4.19.zip ./*

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Stable-4.19
          path: ak3/KernelSU_Stable_4.19.zip